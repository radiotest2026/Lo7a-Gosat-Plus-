<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الكاملة - GOSAT PLUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0b1120;
            --card-bg: #131d31;
            --card-border: #1e2d4a;
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --accent-blue: #2563eb;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-gold: #f59e0b;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-white); padding: 20px 10px; min-height: 100vh; }
        .container { max-width: 550px; margin: 0 auto; }

        .admin-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 12px; padding: 15px; margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h2, h3 { color: var(--accent-gold); text-align: center; margin-bottom: 12px; }
        label { font-size: 0.8rem; color: var(--text-gray); display: block; margin-top: 8px; }
        
        input, select {
            width: 100%; padding: 9px; margin-top: 4px; border-radius: 6px;
            border: 1px solid var(--card-border); background: #0f172a; color: #fff; font-size: 0.85rem;
        }

        .admin-btn {
            width: 100%; padding: 10px; border-radius: 8px; border: none;
            font-weight: 700; cursor: pointer; margin-top: 12px; font-size: 0.9rem;
        }
        .btn-blue { background: var(--accent-blue); color: #fff; }
        .btn-green { background: var(--accent-green); color: #fff; }
        .btn-red { background: var(--accent-red); color: #fff; }
        .btn-gold { background: var(--accent-gold); color: #000; }

        .login-wrapper { max-width: 360px; margin: 60px auto; text-align: center; }
        .flex-row { display: flex; gap: 8px; }
        .flex-row > div { flex: 1; }

        .published-match-card {
            background: #0f172a; border: 1px solid var(--card-border);
            border-radius: 10px; padding: 12px; margin-top: 10px;
        }
        .match-actions {
            display: flex; gap: 8px; margin-top: 10px; border-top: 1px dashed var(--card-border); padding-top: 8px;
        }
        .match-actions button { margin: 0; padding: 6px 10px; font-size: 0.8rem; }
        
        .sub-items-list {
            background: #131d31; border-radius: 6px; padding: 6px; margin-top: 6px; font-size: 0.78rem;
        }
        .sub-item-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 3px 0; border-bottom: 1px solid #1e2d4a;
        }
        .sub-item-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="container">

        <!-- شاشة تسجيل الدخول -->
        <div id="login-box" class="admin-card login-wrapper">
            <h2>لوحة التحكم الإدارية 🔒</h2>
            <label>أدخل كلمة السر الخاصة بك:</label>
            <input type="password" id="pass-input" placeholder="***">
            <button class="admin-btn btn-blue" onclick="checkPass()">دخول اللوحة</button>
        </div>

        <!-- اللوحة الشاملة -->
        <div id="panel-box" style="display: none;">
            
            <h2>لوحة التحكم الموحدة ⚙️</h2>

            <!-- 1. تحديث التاريخ -->
            <div class="admin-card">
                <h3>تحديث تاريخ اليوم</h3>
                <input type="text" id="adm-date-text" placeholder="مثال: الخميس، 13 أغسطس 2026">
                <button class="admin-btn btn-green" onclick="saveDateOnly()">تحديث وحفظ التاريخ</button>
            </div>

            <!-- 2. إضافة / تعديل مباراة -->
            <div class="admin-card">
                <h3 id="form-title">1️⃣ إضافة مباراة جديدة</h3>
                <input type="hidden" id="adm-edit-id" value="">
                
                <label>اسم البطولة:</label>
                <input type="text" id="adm-tournament" placeholder="دوري أبطال أوروبا">
                <label>موعد المباراة:</label>
                <input type="text" id="adm-time" placeholder="22:00">
                
                <div class="flex-row">
                    <div>
                        <label>الفريق الأول:</label>
                        <input type="text" id="adm-t1-name" placeholder="الاسم">
                        <input type="text" id="adm-t1-img" placeholder="رابط اللوجو">
                    </div>
                    <div>
                        <label>الفريق الثاني:</label>
                        <input type="text" id="adm-t2-name" placeholder="الاسم">
                        <input type="text" id="adm-t2-img" placeholder="رابط اللوجو">
                    </div>
                </div>

                <label>المعلق:</label>
                <input type="text" id="adm-comm" placeholder="اسم المعلق">
                <label>القناة الرئيسية:</label>
                <input type="text" id="adm-main-ch" placeholder="bein sports 1">
                <label>القناة الصوتية:</label>
                <input type="text" id="adm-audio" placeholder="Audio 1">

                <button class="admin-btn btn-blue" id="adm-submit-btn" onclick="saveMatch()">حفظ المباراة</button>
                <button class="admin-btn btn-gold" id="adm-cancel-btn" style="display:none;" onclick="cancelEdit()">إلغاء التعديل</button>
            </div>

            <!-- 3. إضافة القنوات الناقلة -->
            <div class="admin-card">
                <h3 style="color:var(--accent-green);">2️⃣ إضافة قناة ناقلة لمباراة</h3>
                <label>اختر المباراة:</label>
                <select id="adm-select-match-ch"></select>
                
                <label>اسم القناة وصورتها:</label>
                <input type="text" id="adm-ch-name" placeholder="اسم القناة">
                <input type="text" id="adm-ch-img" placeholder="رابط اللوجو">
                
                <div class="flex-row">
                    <div>
                        <label>القمر:</label>
                        <input type="text" id="adm-ch-sat" placeholder="Nilesat">
                    </div>
                    <div>
                        <label>التردد:</label>
                        <input type="text" id="adm-ch-freq" placeholder="11013">
                    </div>
                </div>
                <div class="flex-row">
                    <div>
                        <label>الاستقطاب:</label>
                        <input type="text" id="adm-ch-polar" placeholder="H / V">
                    </div>
                    <div>
                        <label>معدل الترميز:</label>
                        <input type="text" id="adm-ch-rate" placeholder="27500">
                    </div>
                </div>
                <button class="admin-btn btn-green" onclick="addChannelToMatch()">إضافة القناة الناقلة</button>
            </div>

            <!-- 4. إضافة التايم شيفت -->
            <div class="admin-card">
                <h3 style="color:var(--accent-gold);">3️⃣ إضافة تايم شيفت لمباراة</h3>
                <label>اختر المباراة:</label>
                <select id="adm-select-match-ts"></select>
                
                <label>اسم قناة التايم شيفت وصورتها:</label>
                <input type="text" id="adm-ts-chname" placeholder="اسم القناة">
                <input type="text" id="adm-ts-img" placeholder="رابط صورة القناة">
                
                <div class="flex-row">
                    <div>
                        <label>القمر:</label>
                        <input type="text" id="adm-ts-sat" placeholder="القمر">
                    </div>
                    <div>
                        <label>التردد:</label>
                        <input type="text" id="adm-ts-freq" placeholder="التردد">
                    </div>
                </div>
                <div class="flex-row">
                    <div>
                        <label>الاستقطاب:</label>
                        <input type="text" id="adm-ts-polar" placeholder="H / V">
                    </div>
                    <div>
                        <label>معدل الترميز:</label>
                        <input type="text" id="adm-ts-rate" placeholder="27500">
                    </div>
                </div>

                <label>القناة الصوتية والتأخير (بالثواني) واسم الريسيفر:</label>
                <input type="text" id="adm-ts-audio" placeholder="الصوتية الأولى">
                <input type="text" id="adm-ts-delay" placeholder="مثال: 5">
                <input type="text" id="adm-ts-receiver" placeholder="اسم الريسيفر الأساسي">
                <label>ريسيفرات تحمل نفس التايم شيفت (مفصولة بفواصل):</label>
                <input type="text" id="adm-ts-same" placeholder="سناتور, نوفا, غزال">

                <button class="admin-btn btn-blue" onclick="addTimeshiftToMatch()">إضافة التايم شيفت</button>
            </div>

            <!-- 5. إدارة وحذف وتعديل المباريات الحالية -->
            <div class="admin-card">
                <h3 style="color:var(--accent-red);">المباريات المنشورة حالياً</h3>
                <div id="adm-matches-list">جاري التحميل...</div>
            </div>

        </div>

    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_CKgSs7ajVzcCdJyqLQfqrXPl7DjJPo0",
            authDomain: "gosat-plus-2.firebaseapp.com",
            projectId: "gosat-plus-2",
            storageBucket: "gosat-plus-2.firebasestorage.app",
            messagingSenderId: "811325857294",
            appId: "1:811325857294:web:19bc8af8d43b3cfa17a65f",
            measurementId: "G-M9WYVYD00G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "gosat_data", "main_data");

        window.dbData = { todayDateText: "", matchesData: [] };

        onSnapshot(docRef, (snapshot) => {
            if (snapshot.exists()) {
                window.dbData = snapshot.data();
                if(!window.dbData.matchesData) window.dbData.matchesData = [];
                if (document.activeElement !== document.getElementById('adm-date-text')) {
                    document.getElementById('adm-date-text').value = window.dbData.todayDateText || '';
                }
                renderAll();
            }
        });

        window.saveDataToCloud = async function() {
            try {
                await setDoc(docRef, window.dbData);
                alert("تم حفظ التعديلات بنجاح وتحديث الموقع!");
            } catch(e) {
                alert("❌ خطأ في الحفظ، تأكد من قواعد Firebase!");
                console.error(e);
            }
        };
    </script>

    <script>
        function checkPass() {
            const p = document.getElementById('pass-input').value;
            if (p === "108") {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('panel-box').style.display = 'block';
            } else {
                alert("كلمة السر غير صحيحة!");
            }
        }

        function renderAll() {
            updateSelectBoxes();
            renderAdminMatchesList();
        }

        function saveDateOnly() {
            const dateVal = document.getElementById('adm-date-text').value;
            if(!dateVal) { alert("أدخل النص أولاً!"); return; }
            window.dbData.todayDateText = dateVal;
            window.saveDataToCloud();
        }

        function saveMatch() {
            const editId = document.getElementById('adm-edit-id').value;
            const tournament = document.getElementById('adm-tournament').value;
            const time = document.getElementById('adm-time').value;
            const t1Name = document.getElementById('adm-t1-name').value;
            const t1Img = document.getElementById('adm-t1-img').value;
            const t2Name = document.getElementById('adm-t2-name').value;
            const t2Img = document.getElementById('adm-t2-img').value;
            const comm = document.getElementById('adm-comm').value;
            const mainChannel = document.getElementById('adm-main-ch').value;
            const audioTrack = document.getElementById('adm-audio').value;

            if(!t1Name || !t2Name) { alert("أدخل أسماء الفريقين!"); return; }

            if (editId) {
                // تعديل مباراة قائمة
                const matchIndex = window.dbData.matchesData.findIndex(m => m.id == editId);
                if (matchIndex !== -1) {
                    window.dbData.matchesData[matchIndex].tournament = tournament;
                    window.dbData.matchesData[matchIndex].time = time;
                    window.dbData.matchesData[matchIndex].t1Name = t1Name;
                    window.dbData.matchesData[matchIndex].t1Img = t1Img;
                    window.dbData.matchesData[matchIndex].t2Name = t2Name;
                    window.dbData.matchesData[matchIndex].t2Img = t2Img;
                    window.dbData.matchesData[matchIndex].comm = comm;
                    window.dbData.matchesData[matchIndex].mainChannel = mainChannel;
                    window.dbData.matchesData[matchIndex].audioTrack = audioTrack;
                }
            } else {
                // إضافة مباراة جديدة
                const newM = {
                    id: Date.now(),
                    tournament, time, t1Name, t1Img, t2Name, t2Img,
                    comm, mainChannel, audioTrack,
                    channels: [], timeshifts: []
                };
                window.dbData.matchesData.push(newM);
            }

            window.saveDataToCloud();
            cancelEdit();
        }

        function editMatch(matchId) {
            const m = window.dbData.matchesData.find(item => item.id == matchId);
            if (!m) return;

            document.getElementById('adm-edit-id').value = m.id;
            document.getElementById('adm-tournament').value = m.tournament || '';
            document.getElementById('adm-time').value = m.time || '';
            document.getElementById('adm-t1-name').value = m.t1Name || '';
            document.getElementById('adm-t1-img').value = m.t1Img || '';
            document.getElementById('adm-t2-name').value = m.t2Name || '';
            document.getElementById('adm-t2-img').value = m.t2Img || '';
            document.getElementById('adm-comm').value = m.comm || '';
            document.getElementById('adm-main-ch').value = m.mainChannel || '';
            document.getElementById('adm-audio').value = m.audioTrack || '';

            document.getElementById('form-title').innerText = "1️⃣ تعديل بيانات المباراة";
            document.getElementById('adm-submit-btn').innerText = "حفظ التعديلات";
            document.getElementById('adm-cancel-btn').style.display = 'block';

            window.scrollTo({ top: document.getElementById('form-title').offsetTop - 20, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('adm-edit-id').value = '';
            document.getElementById('adm-tournament').value = '';
            document.getElementById('adm-time').value = '';
            document.getElementById('adm-t1-name').value = '';
            document.getElementById('adm-t1-img').value = '';
            document.getElementById('adm-t2-name').value = '';
            document.getElementById('adm-t2-img').value = '';
            document.getElementById('adm-comm').value = '';
            document.getElementById('adm-main-ch').value = '';
            document.getElementById('adm-audio').value = '';

            document.getElementById('form-title').innerText = "1️⃣ إضافة مباراة جديدة";
            document.getElementById('adm-submit-btn').innerText = "حفظ المباراة";
            document.getElementById('adm-cancel-btn').style.display = 'none';
        }

        function updateSelectBoxes() {
            const matches = window.dbData.matchesData || [];
            const opts = matches.map((m, i) => `<option value="${i}">${m.t1Name} VS ${m.t2Name}</option>`).join('');
            document.getElementById('adm-select-match-ch').innerHTML = opts;
            document.getElementById('adm-select-match-ts').innerHTML = opts;
        }

        function addChannelToMatch() {
            const idx = document.getElementById('adm-select-match-ch').value;
            if(idx === "" || !window.dbData.matchesData[idx]) return;

            const ch = {
                id: Date.now(),
                name: document.getElementById('adm-ch-name').value,
                img: document.getElementById('adm-ch-img').value,
                sat: document.getElementById('adm-ch-sat').value,
                freq: document.getElementById('adm-ch-freq').value,
                polar: document.getElementById('adm-ch-polar').value,
                rate: document.getElementById('adm-ch-rate').value
            };

            if(!window.dbData.matchesData[idx].channels) window.dbData.matchesData[idx].channels = [];
            window.dbData.matchesData[idx].channels.push(ch);
            window.saveDataToCloud();
        }

        function addTimeshiftToMatch() {
            const idx = document.getElementById('adm-select-match-ts').value;
            if(idx === "" || !window.dbData.matchesData[idx]) return;

            const ts = {
                id: Date.now(),
                chName: document.getElementById('adm-ts-chname').value,
                img: document.getElementById('adm-ts-img').value,
                sat: document.getElementById('adm-ts-sat').value,
                freq: document.getElementById('adm-ts-freq').value,
                polar: document.getElementById('adm-ts-polar').value,
                rate: document.getElementById('adm-ts-rate').value,
                audio: document.getElementById('adm-ts-audio').value,
                delay: document.getElementById('adm-ts-delay').value,
                receiver: document.getElementById('adm-ts-receiver').value,
                sameReceivers: document.getElementById('adm-ts-same').value
            };

            if(!window.dbData.matchesData[idx].timeshifts) window.dbData.matchesData[idx].timeshifts = [];
            window.dbData.matchesData[idx].timeshifts.push(ts);
            window.saveDataToCloud();
        }

        function renderAdminMatchesList() {
            const container = document.getElementById('adm-matches-list');
            const matches = window.dbData.matchesData || [];

            if (matches.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-gray);">لا توجد مباريات مضافة حالياً</div>';
                return;
            }

            container.innerHTML = matches.map((m, mIdx) => {
                const chList = (m.channels || []).map((c, cIdx) => `
                    <div class="sub-item-row">
                        <span>📺 ${c.name} (${c.sat || ''})</span>
                        <button onclick="deleteChannel(${mIdx}, ${cIdx})" class="admin-btn btn-red" style="width:auto; padding:2px 6px; font-size:0.7rem; margin:0;">حذف القناة</button>
                    </div>
                `).join('');

                const tsList = (m.timeshifts || []).map((t, tIdx) => `
                    <div class="sub-item-row">
                        <span>⏱️ ${t.chName} (${t.delay || 0}ث - ${t.receiver || ''})</span>
                        <button onclick="deleteTimeshift(${mIdx}, ${tIdx})" class="admin-btn btn-red" style="width:auto; padding:2px 6px; font-size:0.7rem; margin:0;">حذف التايم</button>
                    </div>
                `).join('');

                return `
                    <div class="published-match-card">
                        <div><strong>${m.t1Name} VS ${m.t2Name}</strong> <small style="color:var(--text-gray);">(${m.tournament || ''} - ${m.time || ''})</small></div>
                        
                        ${chList ? `<div class="sub-items-list"><strong>القنوات الناقلة:</strong>${chList}</div>` : ''}
                        ${tsList ? `<div class="sub-items-list"><strong>التايم شيفت:</strong>${tsList}</div>` : ''}

                        <div class="match-actions">
                            <button onclick="editMatch(${m.id})" class="admin-btn btn-gold">تعديل المباراة</button>
                            <button onclick="deleteMatch(${mIdx})" class="admin-btn btn-red">حذف المباراة بالكامل</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deleteMatch(i) {
            if(confirm("هل أنت متأكد من حذف هذه المباراة بجميع القنوات والتايم شيفت؟")) {
                window.dbData.matchesData.splice(i, 1);
                window.saveDataToCloud();
            }
        }

        function deleteChannel(mIdx, cIdx) {
            if(confirm("هل أنت متأكد من حذف هذه القناة الناقلة؟")) {
                window.dbData.matchesData[mIdx].channels.splice(cIdx, 1);
                window.saveDataToCloud();
            }
        }

        function deleteTimeshift(mIdx, tIdx) {
            if(confirm("هل أنت متأكد من حذف هذا التايم شيفت؟")) {
                window.dbData.matchesData[mIdx].timeshifts.splice(tIdx, 1);
                window.saveDataToCloud();
            }
        }
    </script>
</body>
</html>
